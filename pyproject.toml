[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "guess-the-number"
version = "0.1.0"
description = "Number Guessing Game - Udemy 100 Days of Code, day 12."
readme = "README.md"
requires-python = ">=3.13"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Jens Tirsvad Nielsen" }]
dependencies = []

[project.urls]
Repository = "https://git.tirsystem.com/Tirsvad-Udemy-100-days-of-code/012-guess-the-number"
Documentation = "https://git.tirsystem.com/Tirsvad-Udemy-100-days-of-code/012-guess-the-number/wiki"
"Issue tracker" = "https://git.tirsystem.com/Tirsvad-Udemy-100-days-of-code/012-guess-the-number/issues"

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
guess-the-number = "guess_the_number.game:play_game"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
